# .github/workflows/plugin-publish.yml
# Auto-publishes the plugin to the Dify Marketplace on every push to main:
# 1. Reads plugin info from manifest.yaml (name, version, author)
# 2. Packages the plugin into <name>-<version>.difypkg with the Dify CLI
# 3. Pushes the package to <author>/dify-plugins on branch
#    bump-<name>-plugin-<version>
# 4. Opens a PR against langgenius/dify-plugins
name: Auto Create PR on Main Push

on:
  push:
    branches: [ main ]  # Trigger on push to main
  workflow_dispatch:    # Allow manual runs from the Actions tab

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CLI tool
        run: |
          # Create bin directory in runner temp
          mkdir -p $RUNNER_TEMP/bin
          cd $RUNNER_TEMP/bin

          # Download CLI tool
          wget https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x dify-plugin-linux-amd64

      - name: Get basic info from manifest
        id: get_basic_info
        run: |
          PLUGIN_NAME=$(grep "^name:" manifest.yaml | cut -d' ' -f2)
          echo "Plugin name: $PLUGIN_NAME"
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT

          VERSION=$(grep "^version:" manifest.yaml | cut -d' ' -f2)
          echo "Plugin version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # The author in manifest.yaml must match your GitHub username
          AUTHOR=$(grep "^author:" manifest.yaml | cut -d' ' -f2)
          echo "Plugin author: $AUTHOR"
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Package Plugin
        id: package
        run: |
          cd $GITHUB_WORKSPACE
          PACKAGE_NAME="${{ steps.get_basic_info.outputs.plugin_name }}-${{ steps.get_basic_info.outputs.version }}.difypkg"
          $RUNNER_TEMP/bin/dify-plugin-linux-amd64 plugin package . -o "$PACKAGE_NAME"

          echo "Package result:"
          ls -la "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          # The author's fork of the official dify-plugins repository
          repository: ${{ steps.get_basic_info.outputs.author }}/dify-plugins
          path: dify-plugins
          token: ${{ secrets.PLUGIN_ACTION }}
          fetch-depth: 1 # Fetch only the last commit to speed up checkout
          persist-credentials: true # Persist credentials for subsequent git operations

      - name: Prepare and push branch
        env:
          PLUGIN_NAME: ${{ steps.get_basic_info.outputs.plugin_name }}
          VERSION: ${{ steps.get_basic_info.outputs.version }}
          AUTHOR: ${{ steps.get_basic_info.outputs.author }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$PLUGIN_NAME-$VERSION.difypkg"
          BRANCH_NAME="bump-$PLUGIN_NAME-plugin-$VERSION"

          # Move the packaged file into the author/plugin directory
          mkdir -p "dify-plugins/$AUTHOR/$PLUGIN_NAME"
          mv "$PACKAGE_NAME" "dify-plugins/$AUTHOR/$PLUGIN_NAME/"

          cd dify-plugins

          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Branch from the CURRENT upstream main, not the fork's main:
          # the fork may be stale or have diverged history (upstream was
          # rewritten), which breaks PR creation with "no history in common".
          git remote add upstream https://github.com/langgenius/dify-plugins.git
          git fetch upstream main
          git checkout -b "$BRANCH_NAME" upstream/main

          # Commit only the plugin package (never sweep unrelated fork changes)
          git add "$AUTHOR/$PLUGIN_NAME/"
          git commit -m "bump $PLUGIN_NAME plugin to version $VERSION"

          # Force push in case the branch exists from a previous failed run
          git push -u origin "$BRANCH_NAME" --force

          # Give the GitHub API a moment to sync the new branch
          sleep 10

      - name: Create PR via GitHub API
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
          PLUGIN_NAME: ${{ steps.get_basic_info.outputs.plugin_name }}
          VERSION: ${{ steps.get_basic_info.outputs.version }}
          AUTHOR: ${{ steps.get_basic_info.outputs.author }}
          HEAD_REF: "bump-${{ steps.get_basic_info.outputs.plugin_name }}-plugin-${{ steps.get_basic_info.outputs.version }}"
        run: |
          set -euo pipefail

          PR_COUNT=$(gh pr list --repo langgenius/dify-plugins --head "$HEAD_REF" --state open --json number --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "PR for $HEAD_REF already exists; nothing to do."
          else
            BODY=$(printf 'bump %s plugin package to version %s\n\n## Plugin information\n- **Author**: %s\n- **Plugin name**: %s\n- **Version**: %s\n- **Source repository**: https://github.com/%s/dify-agent-skill-plugin\n- **Contact**: mx@rmbz.net\n\n## Submission type\n- [x] Version update\n\n## What changed\n- Updated plugin package file\n- No breaking changes\n\n## Local validation\n- Dependencies install in a clean Python 3.12 environment\n- Plugin packaging passes the Dify CLI package check\n- Import and unit tests pass locally\n\n## Risk level\n- [x] High risk\n\n## Security and privacy notes\nThe plugin is an agent strategy: it runs user queries through a configurable LLM and may invoke user-configured tools (including code execution, file operations, or arbitrary URL fetching) based on LLM decisions. See PRIVACY.md in the package.\nInput constraints and security boundaries: the plugin itself does not execute code or make network requests; any tool invocations (including code execution, file operations, and URL fetching) happen only through Dify standard tool permission checks and are only performed against user-configured tool credentials. The plugin does not store or transmit user data to any external service.' \
              "$PLUGIN_NAME" "$VERSION" "$AUTHOR" "$PLUGIN_NAME" "$VERSION" "$AUTHOR")
            gh pr create \
              --repo langgenius/dify-plugins \
              --head "$AUTHOR:$HEAD_REF" \
              --base main \
              --title "bump $PLUGIN_NAME plugin to version $VERSION" \
              --body "$BODY"
          fi
